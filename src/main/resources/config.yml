# ClaimBorders configuration
# Every option is read on /claim admin reload. Renderers restart cleanly on reload.

claims:
  # Chunks a player may own. Override per player/group with the permission
  # claimborders.limit.<number> (e.g. claimborders.limit.64) or claimborders.limit.unlimited.
  max-chunks: 16
  # A new chunk must touch one you already own (your first chunk is free to go anywhere).
  require-adjacent: true
  # Worlds where claiming is allowed. Empty list = every world.
  allowed-worlds: []
  # Worlds where claiming is never allowed.
  blocked-worlds: []
  # When a chunk gets claimed, non-trusted players standing inside are moved to the nearest free chunk.
  eject-on-claim: true
  # Same thing on login and respawn: a non-trusted player who appears inside a claim is moved out.
  eject-on-join: true

protection:
  blocks: true        # break / place / buckets
  interact: true      # doors, chests, buttons, levers, pressure plates, trampling...
  entities: true      # outsiders cannot hurt animals, villagers, armor stands, item frames...
  explosions: true    # explosions do not destroy claimed blocks
  pvp: false          # true = no PvP inside claims
  # Mod fake players (Create Deployers, other Forge FakePlayers) are never treated as intruders.
  # Keep this on with Create, or Deployers inside your own base would be blocked as "outsiders".
  ignore-fake-players: true

forcefield:
  enabled: true
  # HARD   : the border is a wall, movement into the claim is simply stopped.
  # BOUNCE : stopped and knocked back (like hitting a shield).
  # PUSH   : a soft repulsion zone starts push-radius blocks before the border, and the line itself still stops you.
  mode: PUSH
  knockback: 0.6          # BOUNCE horizontal strength
  push-radius: 3.0        # PUSH: how far from the border the repulsion starts
  push-strength: 0.35     # PUSH: strength at the border, fades out towards push-radius
  block-teleports: true   # ender pearls, chorus fruit, /tp into a foreign claim
  block-vehicles: true    # boats, minecarts, horses cannot carry outsiders in
  # Visitors (read-only trust) glow while they are inside the claim. Vanilla sends the glow flag to every
  # client, so everyone sees it, not only the owner.
  visitor-glow: true
  message-cooldown-seconds: 2

border:
  # PARTICLES : per-player particle lines + corner posts, only near the viewer. Cheapest, works everywhere.
  # GHOST_BLOCKS : per-player fake blocks. Outsiders see a glass wall around their height, members see a ground outline.
  # DISPLAY : real (non-persistent) BlockDisplay panels per boundary edge: a translucent wall from bedrock to sky, visible to everyone. Needs 1.19.4+.
  # NONE : no visual border (the force field still works).
  renderer: DISPLAY
  # Members see their own borders without typing /claim show.
  show-own-by-default: false
  # Blocks around a player in which borders are drawn (PARTICLES / GHOST_BLOCKS).
  radius: 48
  # How often per-player renderers refresh.
  interval-ticks: 10

  particles:
    type: DUST            # DUST (colored), END_ROD, FLAME, SOUL_FIRE_FLAME, ELECTRIC_SPARK, WAX_ON ...
    color: "#4FC3F7"      # own/trusted claims (DUST only)
    foreign-color: "#FF5252"
    visitor-color: "#FFEE58"
    size: 1.3
    step: 1.0             # spacing along the line, in blocks
    layers: [0, 2]        # horizontal lines at (feet y + offset)
    vertical-span: 6      # corner posts go from y-span to y+span

  ghost-blocks:
    wall-material: LIGHT_BLUE_STAINED_GLASS   # outsiders: a fake wall band around their height
    wall-below: 3
    wall-above: 4
    outline-material: SEA_LANTERN            # members with /claim show: fake blocks on the ground along the border
    visitor-outline-material: GLOWSTONE      # visitors: ground outline (no wall, they may enter)
    radius: 32

  display:
    # BLOCK: panels are scaled block displays using the materials below (opacity is whatever the texture has).
    # TEXT : panels are flat colour quads (text display backgrounds) with free colour and opacity.
    style: BLOCK
    # TEXT style only. opacity 0 = invisible, 1 = solid. Colours per standing in the claim.
    opacity: 0.35
    color: "#4FC3F7"
    visitor-color: "#FFEE58"
    foreign-color: "#FF5252"
    # BLOCK style only. A *_STAINED_GLASS_PANE gives a flat, uniform tint. A full block (e.g. ICE) stretches
    # its whole texture over the panel, frame included.
    # material: what members of the claim see. visitor-material: read-only visitors. foreign-material: everyone else.
    material: LIGHT_BLUE_STAINED_GLASS_PANE
    visitor-material: YELLOW_STAINED_GLASS_PANE
    foreign-material: RED_STAINED_GLASS_PANE
    # FULL = from the world's lowest to highest Y. A number = panel height, placed 2 blocks under the surface.
    height: FULL
    thickness: 0.08
    # true: panels carry a culling box covering the whole wall (correct for vanilla, Sodium/Embeddium and
    # box-aware culling mods). false: no box, the client never frustum-culls the panel, but mods that cull
    # by entity position then judge the wall by a single point. Flip it if walls pop in and out of view.
    culling-box: true
    glow: false
    glow-color: "#4FC3F7"
    hide-from-trusted: true
    # ALWAYS : panels are visible to anyone (except trusted members when hide-from-trusted is on).
    # NEAR   : panels are invisible until a player comes within reveal-radius blocks.
    reveal: NEAR
    reveal-radius: 24

# Short lines above the hotbar (action bar) when players reach a claim. Owners toggle them per claim
# with /claim messages. %owner% and %player% are replaced.
zone-messages:
  enabled: true
  welcome-depth: 4          # blocks inside the border before members and visitors are welcomed
  approach-distance: 16     # blocks before the border where outsiders are warned (before the push zone)
  welcome-owner: "&bWelcome home, %player%."
  welcome: "&bWelcome to %owner%'s land, %player%."
  welcome-visitor: "&eYou are visiting %owner%'s land. Look, but don't touch."
  approach: "&c%owner%'s land ahead. You are not allowed in."

messages:
  prefix: "&b[Claims]&r "
  claimed: "&aChunk claimed! &7(%count%/%limit%)"
  unclaimed: "&eChunk unclaimed. &7(%count%/%limit%)"
  already-own: "&7You already own this chunk."
  taken: "&cThis chunk belongs to &f%owner%&c."
  limit: "&cYou reached your limit of &f%limit%&c chunks."
  not-adjacent: "&cNew chunks must touch one you already own."
  world-disabled: "&cClaiming is disabled in this world."
  not-yours: "&cYou do not own this chunk."
  entry-denied: "&cThis land belongs to &f%owner%&c. You are not allowed in."
  action-denied: "&cYou cannot do that in &f%owner%&c's claim."
  trusted: "&a%player% is now a member of your claim."
  trusted-visitor: "&a%player% may now visit your claim (read-only)."
  view-mode: "&7Border preview: &f%mode%"
  untrusted: "&e%player% is no longer trusted."
  ejected: "&eYou were moved out of &f%owner%&e's claim."
  messages-on: "&aZone messages enabled for your claim."
  messages-off: "&7Zone messages disabled for your claim."
  show-on: "&aClaim borders shown."
  show-off: "&7Claim borders hidden."

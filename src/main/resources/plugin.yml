name: ClaimBorders
version: '${project.version}'
main: io.github.kyr4l.claimborders.ClaimBordersPlugin
api-version: '1.21'
author: Kyr4l
description: Claim chunks one by one and protect them behind a visible force field.

commands:
  claim:
    description: Claim the chunk you stand in, or manage your claim.
    usage: /<command> [help|unclaim|unclaimall|trust|untrust|trustlist|info|list|map|show|view|messages|vanish|lockdown|open|admin]
    aliases: [claims, cb]
  unclaim:
    description: Unclaim the chunk you stand in.
    usage: /<command>
  trust:
    description: Allow a player into your claim (member = full access, visitor = may enter, read-only).
    usage: /<command> <player> [member|visitor]
  untrust:
    description: Remove a player from your claim.
    usage: /<command> <player>

permissions:
  claimborders.use:
    description: Claim chunks and manage your own claim.
    default: true
  claimborders.admin:
    description: Force-unclaim chunks, reload the plugin.
    default: op
  claimborders.bypass:
    description: Walk through force fields and ignore claim protection.
    default: op
  claimborders.open:
    description: Use /claim open to let everyone in as read-only visitors.
    default: true
  claimborders.lockdown:
    description: Use /claim lockdown to seal your own claim.
    default: true
  claimborders.vanish:
    description: Use /claim vanish to hide inside your own claim.
    default: true
  claimborders.vanish.see:
    description: Still see owners who are vanished inside their claim.
    default: op
  claimborders.limit.unlimited:
    description: No chunk limit.
    default: false
  # claimborders.limit.<number> overrides claims.max-chunks for that player.
